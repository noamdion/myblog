baseURL = "https://noamdion.github.io/myblog/"
locale = "en-us"
title = "Ping Lin"
theme = "PaperMod"

[params]
  author = "Ping Lin"
  description = "My life, thoughts, and English learning journey"
  ShowSearchPage = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowToc = true
  TocSide = "right"
  TocOpen = true
  defaultTheme = "light"

  [params.profileMode]
    enabled = true
    title = " "
    subtitle = "My life, thoughts, and English learning journey"
    imageUrl = "images/avatar.jpg"
    imageWidth = 450
    imageHeight = 450
    imageTitle = "avatar"

    [[params.profileMode.buttons]]
      name = "Posts"
      url = "posts/"
    [[params.profileMode.buttons]]
      name = "About"
      url = "about/"
  

  [[params.socialIcons]]
    name = "mail"
    url = "mailto:pingl@mcmaster.ca"



[[menu.main]]
  name = "Search"
  url = "search/"
  weight = 5

[[menu.main]]
  name = "Posts"
  url = "posts/"
  weight = 10

[[menu.main]]
  name = "Tags"
  url = "tags/"
  weight = 15

[[menu.main]]
  name = "Archives"
  url = "archives/"
  weight = 20

[[menu.main]]
  name = "About"
  url = "about/"
  weight = 30


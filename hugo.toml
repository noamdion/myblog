  weight = 10

[[menu.main]]
  name = "Tags"
  url = "tags/"
  weight = 15

[[menu.main]]
  name = "Archives"
  url = "archives/"
  weight = 20

[[menu.main]]
  name = "About"
  url = "about/"
  weight = 30


baseURL = "https://noamdion.github.io/myblog/"
title = "Ping Lin"
theme = "stack"

[params]
  mainSections = ["post"]
  description = "My life, thoughts, and English learning journey"
  author = "Ping Lin"
  customCSS = ["css/custom.css"]

  [params.defaultImage]
    enabled = false

  [params.article]
    math = false
    toc = true

  [params.comments]
    enabled = false

  [params.colorScheme]
    toggle = true
    default = "light"

  [params.sidebar]
    compact = true
    subtitle = "My life, thoughts, and English learning journey"
    avatar = "img/avatar.jpg"

  [params.footer]
    since = 2026
    customText = ""

  [params.dateFormat]
    published = "2006-01-02"
    lastUpdated = "2006-01-02"

[menu]
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 5

  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/post/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

  [[menu.main]]
    identifier = "about"
    name = "About Me"
    url = "/about/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params.widgets]
  homepage = []

  [[params.widgets.page]]
    type = "toc"
    [params.widgets.page.params]
      icon = "list"
      
